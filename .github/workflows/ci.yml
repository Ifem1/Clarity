name: clarity-ci
on:
  push:
  pull_request:
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m py_compile contracts/clarity.py
      - run: python -m pytest -q tests --ignore=tests/direct
  genlayer-direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'genlayer-test==0.29.2'
      - run: python -m pytest -p gltest.direct.pytest_plugin -p gltest.fixtures -q tests/direct
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test frontend/test/*.test.mjs
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
